spring:
  datasource:
    url: jdbc:h2:mem:linguacards;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  security:
    jwt:
      issuer: https://linguacards.test
      secret: "test-only-secret-with-at-least-32-bytes"
      expiration-minutes: 60
