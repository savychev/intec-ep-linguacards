name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test -- --watch=false

      - name: Build production bundle
        run: npm run build

  security:
    name: Dependency and repository security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check tracked repository artifacts
        shell: bash
        run: |
          tracked_generated=$(git ls-files | grep -E '(^|/)(node_modules|dist|target|playwright-report|test-results)/' || true)
          if [[ -n "$tracked_generated" ]]; then
            echo "Generated artifacts must not be tracked:"
            echo "$tracked_generated"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Resolve backend dependency graph
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress dependency:go-offline

      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          hide-progress: true
          timeout: 10m

  containers:
    name: Container stack + browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start container stack
        run: docker compose up --build --detach --wait

      - name: Verify frontend and proxied API
        run: |
          curl --fail --silent --show-error http://localhost:4200/ > /dev/null
          curl --fail --silent --show-error http://localhost:4200/api/health \
            | grep --fixed-strings '"status":"ok"'

      - name: Run browser happy path
        working-directory: frontend
        run: |
          npm run e2e:check
          npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload demo screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: demo-screenshots
          path: frontend/test-results/**/0?-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop container stack
        if: always()
        run: docker compose down --volumes --remove-orphans
