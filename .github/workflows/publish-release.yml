name: Publish release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-release.yml

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Annotated tag and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          backend_version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          namespace = "{http://maven.apache.org/POM/4.0.0}"
          project = ET.parse("backend/pom.xml").getroot()
          print(project.findtext(f"{namespace}version"))
          PY
          )"
          frontend_version="$(node --print "require('./frontend/package.json').version")"

          if [[ "$backend_version" != "$frontend_version" ]]; then
            echo "Backend and frontend versions differ: $backend_version != $frontend_version"
            exit 1
          fi
          if [[ ! "$backend_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version is not stable semantic versioning: $backend_version"
            exit 1
          fi
          if ! grep --fixed-strings --quiet "## [$backend_version] -" CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for $backend_version"
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            target_sha="$BEFORE_SHA"
          else
            target_sha="$GITHUB_SHA"
          fi
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Cannot resolve the release commit: $target_sha"
            exit 1
          fi
          git cat-file -e "$target_sha^{commit}"
          git diff --exit-code "$target_sha" "$GITHUB_SHA" -- \
            CHANGELOG.md backend/pom.xml frontend/package.json

          echo "tag=v$backend_version" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
          VERSION: ${{ steps.metadata.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"].removeprefix("v")
          lines = Path("CHANGELOG.md").read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith(f"## [{version}] "))
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## [")),
              len(lines),
          )
          notes = "\n".join(lines[start + 1 : end]).strip() + "\n"
          if not notes.strip():
              raise SystemExit("Release notes are empty")
          Path(os.environ["NOTES_FILE"]).write_text(notes)
          PY

      - name: Publish annotated tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
          TAG: ${{ steps.metadata.outputs.tag }}
          TARGET_SHA: ${{ steps.metadata.outputs.target_sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            existing_target="$(git rev-list --max-count=1 "$TAG")"
            if [[ "$existing_target" != "$TARGET_SHA" ]]; then
              echo "Existing tag $TAG points to $existing_target, expected $TARGET_SHA"
              exit 1
            fi
          else
            tag_object_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              --field tag="$TAG" \
              --field message="LinguaCards $TAG" \
              --field object="$TARGET_SHA" \
              --field type=commit \
              --jq .sha)"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/$TAG" \
              --field sha="$tag_object_sha" > /dev/null
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "LinguaCards $TAG" \
            --notes-file "$NOTES_FILE"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
