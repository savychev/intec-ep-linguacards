<a class="skip-link" href="#main-content">Skip to content</a>

<header class="app-header">
  <a class="brand" routerLink="/" aria-label="LinguaCards home">
    <span class="brand-mark" aria-hidden="true">L</span>
    <span>LinguaCards</span>
  </a>

  @if (auth.isAuthenticated()) {
    <nav class="app-nav" aria-label="Main navigation">
      <a routerLink="/decks">My decks</a>
      <button type="button" class="text-button" (click)="logout()">Sign out</button>
    </nav>
  }
</header>

<main id="main-content" class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  <span>Learn words in context, one card at a time.</span>
</footer>
