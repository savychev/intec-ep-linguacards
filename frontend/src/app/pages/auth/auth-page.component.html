<section class="auth-card">
  <h1>Login</h1>
  <p class="hint">Учебный режим: если пользователя нет, он создастся автоматически.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" placeholder="you@example.com">
    </label>

    <label>
      Password
      <input type="password" formControlName="password" placeholder="1234">
    </label>

    @if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
      <p class="error">Password must be at least 4 characters long.</p>
    }

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <button type="submit">Continue</button>
  </form>
</section>
