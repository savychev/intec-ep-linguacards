spring.datasource.url=jdbc:h2:mem:linguacards_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.test.database.replace=none
app.security.require-auth-for-api=false
app.security.jwt.secret=test-secret-test-secret-test-secret-12
app.security.jwt.issuer=linguacards-test
app.security.jwt.ttl-seconds=3600
